<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login">
    <h1 class="titulo">Crie sua conta!</h1>
    <form action="" id="cadastro">
        <label for="nome" class="nome" >Nome</label>
        <input type="text" id="nome" class="nome" required>
        <br>
        <label for="senha" class="senha">Senha</label>
        <input type="password" id="senha" class="senha" required>
        <br>
        <p class="verificacao">Já tem uma conta ? <a class="redirecionar" href="login.html">Entre!</a></p>
        <button type="submit" class="botao" >Crie!</button>
    </form>
</body>
</html>

<script>
    document.getElementById("cadastro").addEventListener("submit", function(e){

        e.preventDefault()

        var nome = document.getElementById("nome").value;
        var senha = document.getElementById("senha").value;

        if(localStorage.getItem(nome)){
            alert("Esse nome já existe. Tem outro.")
            return;
        }

        localStorage.setItem(nome, senha);

        alert("Cadastrado com sucesso!")

        window.location.href = 'login.html'

    })
</script>
